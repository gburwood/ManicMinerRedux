acceptance_criteria:
  criteria:
  - Add a narrowly defined historical compatibility issue for a superseded proposal
    missing only governance_tier.requested; retain the original proposal bytes and
    all presentation/approval evidence.
  - Correction targets PROP-0001-01 at its exact immutable SHA-256 and declares requested
    HIGH under its archived policy. Verify its scope classification and existing policy/calculated
    minimum; never lower a protected tier or waive unrelated errors.
  - Require a current different proposal in the same change, explicit superseding
    lineage, and a valid managed human approval of this repair proposal that expressly
    scopes the correction record. Bind the correction to its target id/path/hash,
    archived policy, superseding proposal and repair proposal/approval proof. Refuse
    correction of a current proposal or any proposal previously used for approved
    implementation.
  - Use shared fail-closed correction verification in full and incremental integrity
    validation. Full validation must apply governance-tier checks to controlled_v3
    as well as controlled_v2, including retained superseded revisions with declared
    scope. No full-audit state refresh may conceal the known missing-tier error.
  - Tier prepare must reject missing or invalid requested tiers before modifying proposal
    bytes or writing preparation evidence. Preserve valid existing HIGH-tier preparation.
  - Add portable regression cases for valid historical correction, missing approval,
    digest drift, current target, unrelated malformed tier, stale/invalid policy,
    below-minimum correction and full/incremental parity.
  - After implementation run relevant regression suites and exhaustive validation
    required for changed validator/schema semantics; establish a state-only integrity
    receipt only after successful audit. Capture actual implementation/source-revision
    evidence and prepare a governed checkpoint for human acceptance.
  - PROJECT.md and CHG-0001 approved proposal remain unchanged during the Core repair.
    Resume CHG-0001 only once the Core repair has met required gates; recheck its
    exact approval and implementation authority, apply its prepared definition, validate
    and stop at checkpoint acceptance.
